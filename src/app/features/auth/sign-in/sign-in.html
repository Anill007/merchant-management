<form [formGroup]="signInForm" (ngSubmit)="onSubmit()">
    <label for="user-name">
        <span>Username:</span>
        <input type="email" name="user-name" formControlName="useremail" placeholder="username@domain.com">
        @if (
        signInForm.controls.useremail.touched &&
        signInForm.controls.useremail.hasError('required')
        ) {
        <p class="error-message">Email is required.</p>
        } @else if (
        signInForm.controls.useremail.touched &&
        signInForm.controls.useremail.hasError('email')
        ) {
        <p class="error-message">Please enter a valid email address.</p>
        }
    </label>
    <br>
    <label for="user-psw">
        <span>Username:</span>
        <input type="password" name="user-psw" id="user-psw" formControlName="password"
            placeholder="Enter your password">
    </label>
    <br>
    <button type="submit">Sign In</button>
</form>
