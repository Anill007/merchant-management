<header class="app-header">
    <div class="brand">
        Merchant Dashboard
    </div>

    <div class="user-section">
        @if (auth.currentUser; as user) {
        <div class="user-info">
            <span class="user-name">{{ user.name }}</span>
            <span class="user-role">{{ user.role }}</span>
        </div>

        <button type="button" class="logout-button" (click)="logout()">
            Logout
        </button>
        }
    </div>
</header>
